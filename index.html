<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>CineClub H</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="cinema" id="cinema">

    <!-- The video is already underneath the intro.
         The intro zooms away to reveal it. -->
    <section class="player" aria-label="Sala de CineClub H">
      <div class="video-shell">
        <video id="screeningVideo" playsinline preload="metadata">
          <!-- Later:
          <source src="movie.mp4" type="video/mp4">
          -->
        </video>

        <div class="video-placeholder">
          <div class="placeholder-label">CINECLUB H</div>
          <div class="placeholder-status">PRÓXIMAMENTE</div>
        </div>

        <div class="player-ui">
          <div class="player-top">
            <span class="live-dot"></span>
            <span>EN VIVO</span>
          </div>

          <div class="player-bottom">
            <div class="progress"><span></span></div>
            <div class="controls">
              <button id="playButton" type="button" aria-label="Reproducir">▶</button>
              <span class="time">00:00</span>
              <span class="spacer"></span>
              <button type="button" aria-label="Pantalla completa">⛶</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Intro / loading state -->
    <section class="intro" id="intro" aria-label="Cargando CineClub H">
      <div class="logo-wrap">
        <img src="assets/cineclub-h-mark.png" alt="CineClub H">
        <div class="scanlines"></div>
      </div>

      <div class="loading">
        <span>LOADING</span><span class="dots">...</span>
      </div>
    </section>

    <button class="skip" id="skipIntro" type="button">SKIP</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
