<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>CineClub H</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="cinema">

  <section class="player">
    <div class="video-shell">
      <video id="screeningVideo" playsinline preload="metadata"></video>
      <div class="video-placeholder">
        <div class="placeholder-label">CINECLUB H</div>
        <div class="placeholder-status">PRÓXIMAMENTE</div>
      </div>
      <div class="player-ui">
        <div class="player-top"><span class="live-dot"></span> EN VIVO</div>
        <div class="player-bottom">
          <div class="progress"><span></span></div>
          <div class="controls">
            <button id="playButton" type="button">▶</button>
            <span>00:00</span><span class="spacer"></span>
            <button type="button">⛶</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="intro" id="intro">
    <div class="logo-wrap">
      <div class="animated-fill"></div>
      <img class="logo-outline" src="assets/cineclub-h-outline.png" alt="CineClub H">
      <div class="scanlines"></div>
      <div class="film-flicker"></div>
    </div>
    <div class="loading">LOADING<span class="dots">...</span></div>
  </section>

  <button class="skip" id="skipIntro" type="button">SKIP</button>
</main>
<script src="script.js"></script>
</body>
</html>
